name: 'Build for Testing'
description: 'Builds the project for testing and creates an xctestrun artifact.'

inputs:
  destination-udid:
    description: 'The UDID of the simulator to use for testing'
    required: true

runs:
  using: "composite"
  steps:
    - name: Build for testing
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -workspace "SDET Demo App.xcworkspace" \
          -scheme "AllTests" \
          -destination "id=${{ inputs.destination-udid }}" \
          -derivedDataPath build
