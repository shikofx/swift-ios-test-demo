name: 'Create SwiftFormat Report Page'
description: 'Converts a SwiftFormat JSON report to a Markdown file for Jekyll.'

inputs:
  json-path:
    description: 'Path to the input swiftformat-report.json file.'
    required: true
  output-path:
    description: 'Path where the output swiftformat-report.md file will be created.'
    required: true

runs:
  using: "composite"
  steps:
    - name: Generate Markdown from JSON
      shell: bash
      run: |
        JSON_FILE="${{ inputs.json-path }}"
        PAGE_FILE="${{ inputs.output-path }}"
        SITE_PATH=$(dirname "${{ inputs.output-path }}")
        DATA_FILE="$SITE_PATH/_data/swiftformat.json"

        if [ ! -f "$JSON_FILE" ]; then
          echo "::warning::SwiftFormat report not found at $JSON_FILE. Skipping page generation."
          echo "[]" > "$DATA_FILE" # Create an empty JSON file so Jekyll doesn't fail
        else
          # Copy the report to the _data folder
          mkdir -p "$SITE_PATH/_data"
          cp "$JSON_FILE" "$DATA_FILE"
        fi

        # Create a simple template page that will use data from _data
        cat <<'EOF' > "$PAGE_FILE"
        ---
        layout: default
        title: SwiftFormat Style Report
        ---
        ## SwiftFormat Style Report

        {% if site.data.swiftformat.size > 0 %}
        | # | File | Location | Rule | Reason |
        |---|------|----------|------|--------|
        {% for item in site.data.swiftformat -%}
        | {{ forloop.index }} | `{{ item.file }}` | `{{ item.line }}` | `{{ item.rule }}` | `{{ item.reason | escape }}` |
        {%- endfor %}
        {% else %}
        No SwiftFormat violations found. Great job! ✨
        {% endif %}
        EOF

        echo "SwiftFormat data and page generated."