name: 'Setup Project'
description: 'Installs all project dependencies and caches them.'

runs:
  using: "composite"
  steps:
    - name: Install Homebrew dependencies
      shell: bash
      run: brew bundle

    - name: Cache Pods
      uses: actions/cache@v4
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Install CocoaPods dependencies
      shell: bash
      run: pod install