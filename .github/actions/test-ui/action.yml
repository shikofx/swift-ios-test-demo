name: 'Run UI Tests'
description: 'Runs UI tests and generates test results.'

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: xctestrun-build
        path: build

    - name: Run UI tests
      shell: bash
      run: |
        # Find an available iPhone simulator
        DESTINATION_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | .[] | .[] | select(.name | startswith("iPhone")) | .udid' | head -n 1)
        if [ -z "$DESTINATION_UDID" ]; then
          echo "::error::No available iPhone simulator found."
          exit 1
        fi
        echo "Using simulator with UDID: $DESTINATION_UDID"

        TOTAL_CORES=$(sysctl -n hw.ncpu)
        WORKER_COUNT=$((TOTAL_CORES > 1 ? TOTAL_CORES - 1 : 1))
        echo "Total CPU cores: $TOTAL_CORES. Using $WORKER_COUNT for parallel testing."

        # Run tests on the found simulator
        XCTESTRUN_FILE=$(find build/Build/Products -name "AllTests*.xctestrun")
        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN_FILE" \
          -destination "id=$DESTINATION_UDID" \
          -parallel-testing-enabled YES \
          -parallel-testing-worker-count "$WORKER_COUNT" \
          -only-testing:SDET\ Demo\ AppUITests \
          -resultBundlePath "ui-test-results/TestResults.xcresult"

    - name: Upload UI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: ui-test-results/