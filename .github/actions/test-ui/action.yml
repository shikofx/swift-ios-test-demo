name: 'Run UI Tests'
description: 'Runs UI tests and generates test results.'

inputs:
  destination-udid:
    description: 'The UDID of the simulator to use for testing'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: xctestrun-build
        path: build

    - name: Run UI tests
      shell: bash
      run: |
        # Run tests on the found simulator
        XCTESTRUN_FILE=$(find build/Build/Products -name "AllTests*.xctestrun")
        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN_FILE" \
          -destination "id=${{ inputs.destination-udid }}" \
          -only-testing:SDET\ Demo\ AppUITests \
          -resultBundlePath "ui-test-results/TestResults.xcresult"

    - name: Upload UI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: ui-test-results/