name: 'Run Unit Tests'
description: 'Runs unit tests, generates raw coverage data and test results.'

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: xctestrun-build
        path: build

    - name: Run Unit Tests
      shell: bash
      run: |
        # Find the .xctestrun file from the downloaded artifact
        XCTESTRUN_FILE=$(find build -name "*.xctestrun")
        echo "Found xctestrun file at: $XCTESTRUN_FILE"
        
        DESTINATION_UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep '(Shutdown)' | head -n 1 | awk -F'[()]' '{print $2}')
        echo "Using destination UDID: $DESTINATION_UDID"

        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN_FILE" \
          -destination "id=$DESTINATION_UDID" \
          -enableCodeCoverage YES \
          -resultBundlePath ./TestResults.xcresult
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: TestResults.xcresult
        retention-days: 1
    