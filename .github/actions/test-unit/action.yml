name: 'Run Unit Tests'
description: 'Runs unit tests, generates raw coverage data and test results.'

inputs:
  destination-udid:
    description: 'The UDID of the simulator to use for testing'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: xctestrun-build
        path: build

    - name: Run Unit Tests
      shell: bash
      run: |
        XCTESTRUN_FILE=$(find build/Build/Products -name "AllTests*.xctestrun")
        echo "Found xctestrun file at: $XCTESTRUN_FILE"
        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN_FILE" \
          -destination "id=${{ inputs.destination-udid }}" \
          -only-testing:Demo\ AppTests \
          -resultBundlePath "unit-test-results/TestResults.xcresult"
    