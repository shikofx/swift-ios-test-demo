name: IOS-DEMO

on:
  push:
    branches:
      - test
      - 'feature/**' # Запускать при push в feature-ветки
  # pull_request:
  #   branches:
  #     - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  swiftlint_analysis:
    name: Static Analysis - SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Swiftlint Report
        uses: ./.github/actions/create-swiftlint-report-page

  swiftformat_analysis:
    name: Static Analysis - SwiftFormat
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SwiftFormat Report
        uses: ./.github/actions/create-swiftformat-report-page

  build_site:
    name: Build Reports Site
    needs: [swiftlint_analysis, swiftformat_analysis
      # swiftformat_analysis, 
      # unit_tests
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure github pages
        uses: actions/configure-pages@v5

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .source

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts

      - name: Verify downloaded artifacts
        run: |
          cat .artifacts/swiftlint-report/index.md
          cat .artifacts/swiftformat-report/index.md

      - name: Prepare .site content
        run: |
          cp -r .source/.site/ .
          mkdir -p .site/reports/swiftlint
          mv .artifacts/swiftlint-report/index.md .site/reports/swiftlint/index.md || echo "swiftlint-report.md not found"
          mkdir -p .site/reports/swiftformat
          mv .artifacts/swiftformat-report/index.md .site/reports/swiftformat/index.md || echo "swiftformat-report.md not found"

      - name: Verify .site content
        run: |
          ls -R .site

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        env:
          JEKYLL_VERBOSE: true
        with:
          source: ./.site
          destination: ./_site
            
      - name: Verify result site content
        run: |
          ls -R ./_site
          
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3

