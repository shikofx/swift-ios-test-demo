  unit_tests:
    name: Unit Tests
    needs: [
      swiftlint_analysis, 
      swiftformat_analysis
    ]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests and generate report
        uses: ./.github/actions/test-unit

  generate_coverage_report:
    name: Report - Coverage
    needs: unit_tests
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download raw test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .

      - name: Generate HTML Report
        uses: ./.github/actions/swift-coverage-report
        with: 
          test-results-path: TestResults.xcresult
          github-token: ${{ secrets.GITHUB_TOKEN }}

  generate_allure_report:
    name: Report - Test
    needs: unit_tests
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .

      - name: Create Allure Report page
        uses: ./.github/actions/allure-report
        with:
          test-results-path: TestResults.xcresult
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build_site:
    name: Build Reports Site
    needs: [
      generate_coverage_report,
      generate_allure_report
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Checkout github-pages repository
        uses: actions/checkout@v4
        with:
          repository: shikofx/github-pages
          path: gh-pages-repo
          ref: ${{ github.event.repository.name }} # Указываем, что работать нужно с веткой, названной как наш репозиторий
          token: ${{ secrets.GH_PAGES_PAT }} 

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
      
      - name: Prepare and publish raw data
        run: |
          # Определяем общий статус предыдущих jobs
          CONCLUSION="success"
          # Статус всего билда определяется успехом или провалом ключевого job'а - unit_tests.
          if [[ "${{ needs.unit_tests.result }}" == "failure" ]]; then
            CONCLUSION="failure"
          fi
          
          # Вызываем скрипт, который создает папки и мета-файлы
          bash ./.github/scripts/create-publish-data.sh \
            "gh-pages-repo" \
            ".artifacts" \
            "${{ github.ref_name }}" \
            "${{ github.run_number }}" \
            "${{ github.sha }}" \
            "${{ github.actor }}" \
            "$CONCLUSION" \
            "${{ github.event.repository.name }}"
      
      - name: Commit and Push data to github-pages
        run: |
          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Коммитим и пушим изменения в целевую ветку
          if ! git diff --staged --quiet; then
            git commit -m "Add report for build ${{ github.run_number }} from ${{ github.repository }}"
            git push
          else
            echo "No changes to commit."
          fi
      
      - name: Show report URL
        run: |
          echo "================================================================="
          echo "Data has been published to the shikofx/github-pages repository."
          echo "The report will be available at the following URL after the site is built:"
          echo "https://shikofx.github.io/github-pages/projects/${{ github.event.repository.name }}/$(echo ${{ github.ref_name }} | sed 's/\//-/g')/${{ github.run_number }}/"
          echo "================================================================="

