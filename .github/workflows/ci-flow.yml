name: IOS-DEMO-CI

on:
  push:
    branches:
      - main
      - 'feature/**' # Запускать при push в feature-ветки
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analysis:
    name: Code Analysis
    uses: ./.github/workflows/static-analysis.yml

  # build_for_testing:
