  deploy_site: 
    name: Deploy Reports Site
    runs-on: ubuntu-latest
    needs: build_site
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set sanitized branch name for artifact
        id: set_vars # This step is not currently used by deploy-pages, but might be useful for other steps.
        run: echo "sanitized_branch=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
