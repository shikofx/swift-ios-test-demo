name: IOS-DEMO

on:
  push:
    branches:
      - '**'
      
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  swiftlint_analysis:
    name: Static Analysis - SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Swiftlint Report
        uses: ./.github/actions/swiftlint-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  swiftformat_analysis:
    name: Static Analysis - SwiftFormat
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SwiftFormat Report
        uses: ./.github/actions/swiftformat-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

