name: IOS-DEMO

on:
  push:
    branches:
      - '**' 
      
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    name: Setup Environment
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project dependencies
        id: setup_project
        uses: ./.github/actions/setup-project

  swiftlint_analysis:
    name: Static Analysis - SwiftLint
    needs: setup
    runs-on: macos-latest
    
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Swiftlint Report
        uses: ./.github/actions/swiftlint-report

  swiftformat_analysis:
    name: Static Analysis - SwiftFormat
    needs: setup
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SwiftFormat Report
        uses: ./.github/actions/swiftformat-report

  build_for_testing:
    name: Build for Testing
    needs: 
      - setup
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/Podfile.lock') }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/Podfile.lock') }}-
            ${{ runner.os }}-xcode-deriveddata-

      - name: Restore Pods cache
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Restore Homebrew cache
        uses: actions/cache@v4
        with:
          path: /opt/homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Build for Testing
        uses: ./.github/actions/build-for-testing


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xctestrun-build
          path: build
          retention-days: 1

  unit_tests:
    name: Unit Tests
    needs: build_for_testing
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests and generate report
        uses: ./.github/actions/test-unit

  ui_tests:
    name: UI Tests
    needs: 
      - build_for_testing
      - unit_tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run UI tests
        uses: ./.github/actions/test-ui

  merge_test_results:
    name: Merge Test Results
    needs: [unit_tests, ui_tests]
    if: always()
    runs-on: macos-latest
    steps:
      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results/

      - name: Download UI test results
        uses: actions/download-artifact@v4
        with:
          name: ui-test-results
          path: ui-test-results/

      - name: List downloaded files for debugging
        run: |
          echo "--- Listing all downloaded files ---"
          ls -R

      - name: Merge test results
        run: |
          xcrun xcresulttool merge ui-test-results/TestResults.xcresult unit-test-results/TestResults.xcresult --output-path merged-test-results.xcresult

      - name: Upload merged test results
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-results
          path: merged-test-results.xcresult

  generate_coverage_report:
    name: Report - Coverage
    needs: merge_test_results
    continue-on-error: true
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download merged test results
        uses: actions/download-artifact@v4
        with:
          name: merged-test-results
          path: ./merged-test-results.xcresult

      - name: -------verify content------
        shell: bash
        run: |
          ls -R

      - name: Generate HTML Report
        uses: ./.github/actions/swift-coverage-report
        with: 
          test-results-path: ./merged-test-results.xcresult

  generate_allure_report:
    name: Report - Test
    needs: merge_test_results
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download merged test results
        uses: actions/download-artifact@v4
        with:
          name: merged-test-results
          path: ./merged-test-results.xcresult

      - name: -------verify content------
        shell: bash
        run: |
          ls -R
          
      - name: Create Allure Report page
        uses: ./.github/actions/allure-report
        with:
          test-results-path: ./merged-test-results.xcresult

  build_site:
    name: Build Reports Site
    needs:
      - generate_coverage_report
      - generate_allure_report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure github pages
        uses: actions/configure-pages@v5

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
          
      - name: Prepare .site content
        run: |
          mkdir -p .site/reports/swiftlint
          mv .artifacts/swiftlint-report/* .site/reports/swiftlint/ || echo "swiftlint-report not found"
          mkdir -p .site/reports/swiftformat && mv .artifacts/swiftformat-report/* .site/reports/swiftformat/ || echo "swiftformat-report not found"
          mkdir -p .site/reports/coverage
          mv .artifacts/coverage-report/* .site/reports/coverage/ || echo "coverage-report directory not found"
          mkdir -p .site/reports/allure
          mv .artifacts/allure-report/* .site/reports/allure/ || echo "allure-report not found"
          mv .artifacts/index-page-with-allure/index.md .site/index.md || echo "index.md not found"
          cp -r .artifacts/previous-site-version/* .site/ || echo "previous-site-version not found"
          cat .artifacts/index-page-with-allure/_config.yml >> .site/_config.yml || echo "_config.yml not found"

      - name: Inject GitHub metadata into Jekyll config
        run: |
          echo "Adding GitHub metadata to .site/_config.yml"
          echo "" >> .site/_config.yml
          echo "timezone: Europe/Minsk" >> .site/_config.yml
          echo "github:" >> .site/_config.yml
          echo "  repository_url: ${{ github.server_url }}/${{ github.repository }}" >> .site/_config.yml
          echo "  actor: ${{ github.actor }}" >> .site/_config.yml
          echo "  event_name: ${{ github.event_name }}" >> .site/_config.yml
          echo "  ref_name: ${{ github.ref_name }}" >> .site/_config.yml
          echo "  sha: ${{ github.sha }}" >> .site/_config.yml
          echo "  run_id: ${{ github.run_id }}" >> .site/_config.yml
          echo "  run_number: ${{ github.run_number }}" >> .site/_config.yml
          echo "baseurl: /${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.run_number }}" >> .site/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        env:
          JEKYLL_VERBOSE: true
        with:
          source: ./.site
          destination: ./_site/${{github.ref_name}}/${{ github.run_number }}

      - name: Find previous successful run
        id: find_previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-flow.yml/runs?branch=${{ github.ref_name }}&status=success" \
            --jq '.workflow_runs | map(select(.id != ${{ github.run_id }})) | .[0].id')

          if [ -n "$previous_run_id" ] && [ "$previous_run_id" != "null" ]; then
            echo "Found previous successful run ID: $previous_run_id"
            echo "run_id=$previous_run_id" >> $GITHUB_OUTPUT
          else
            echo "No previous successful run found for this branch. Skipping download."
          fi

      - name: Download previous site artifact
        if: steps.find_previous_run.outputs.run_id
        uses: ./.github/actions/previous-site
        with:
          source_run_id: ${{ steps.find_previous_run.outputs.run_id }}
          download_path: ./.history

      - name: Copy history to the _site directory
        run: |
          if [ -d ".history" ]; then
            sudo cp -r ./.history/* ./_site/
          else 
            echo "The folder .history does not exitst. The step is skipped"
          fi
            
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3

  deploy_site: 
    name: Deploy Reports Site
    runs-on: ubuntu-latest
    needs: build_site
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{github.ref_name}}/${{ github.run_number }}
    steps:
      - name: Set sanitized branch name for artifact
        id: set_vars 
        run: echo "sanitized_branch=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

