  unit_tests:
    name: Unit Tests
    needs: [
      swiftlint_analysis, 
      swiftformat_analysis
    ]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests and generate report
        uses: ./.github/actions/test-unit

  generate_coverage_report:
    name: Report - Coverage
    needs: unit_tests
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download raw test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .

      - name: Generate HTML Report
        uses: ./.github/actions/swift-coverage-report
        with: 
          test-results-path: TestResults.xcresult

  generate_allure_report:
    name: Report - Test
    needs: unit_tests
    if: always()
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .

      - name: Create Allure Report page
        uses: ./.github/actions/allure-report
        with:
          test-results-path: TestResults.xcresult

  build_site:
    name: Build Reports Site
    needs: [
      generate_coverage_report,
      generate_allure_report
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure github pages
        uses: actions/configure-pages@v5

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
          
      - name: Prepare .site content
        run: |
          mkdir -p .site/reports/swiftlint
          mv .artifacts/swiftlint-report/* .site/reports/swiftlint/ || echo "swiftlint-report not found"
          mkdir -p .site/reports/swiftformat && mv .artifacts/swiftformat-report/* .site/reports/swiftformat/ || echo "swiftformat-report not found"
          mkdir -p .site/reports/coverage
          mv .artifacts/coverage-report/* .site/reports/coverage/ || echo "coverage-report directory not found"
          mkdir -p .site/reports/allure
          mv .artifacts/allure-report/* .site/reports/allure/ || echo "allure-report not found"
          mv .artifacts/index-page-with-allure/index.md .site/index.md || echo "index.md not found"
          cp -r .artifacts/previous-site-version/* .site/ || echo "previous-site-version not found"
          cat .artifacts/index-page-with-allure/_config.yml >> .site/_config.yml || echo "_config.yml not found"

      - name: Inject GitHub metadata into Jekyll config
        run: |
          echo "Adding GitHub metadata to .site/_config.yml"
          echo "" >> .site/_config.yml
          echo "timezone: Europe/Minsk" >> .site/_config.yml
          echo "github:" >> .site/_config.yml
          echo "  repository_url: ${{ github.server_url }}/${{ github.repository }}" >> .site/_config.yml
          echo "  actor: ${{ github.actor }}" >> .site/_config.yml
          echo "  event_name: ${{ github.event_name }}" >> .site/_config.yml
          echo "  ref_name: ${{ github.ref_name }}" >> .site/_config.yml
          echo "  sha: ${{ github.sha }}" >> .site/_config.yml
          echo "  run_id: ${{ github.run_id }}" >> .site/_config.yml
          echo "  run_number: ${{ github.run_number }}" >> .site/_config.yml
          echo "baseurl: /${{ github.event.repository.name }}/${{ github.ref_name }}/${{ github.run_number }}" >> .site/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        env:
          JEKYLL_VERBOSE: true
        with:
          source: ./.site
          destination: ./_site/${{github.ref_name}}/${{ github.run_number }}

      - name: Find previous successful run
        id: find_previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ищем последний успешный запуск этого воркфлоу для текущей ветки,
          # который не является текущим запуском.
          previous_run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-flow.yml/runs?branch=${{ github.ref_name }}&status=success" \
            --jq '.workflow_runs | map(select(.id != ${{ github.run_id }})) | .[0].id')

          if [ -n "$previous_run_id" ] && [ "$previous_run_id" != "null" ]; then
            echo "Found previous successful run ID: $previous_run_id"
            echo "run_id=$previous_run_id" >> $GITHUB_OUTPUT
          else
            echo "No previous successful run found for this branch. Skipping download."
          fi

      - name: Download previous site artifact
        if: steps.find_previous_run.outputs.run_id
        uses: ./.github/actions/previous-site
        with:
          source_run_id: ${{ steps.find_previous_run.outputs.run_id }}
          download_path: ./.history

      - name: Copy history to the _site directory
        run: |
          sudo cp -r ./.history/* ./_site/

      - name: Verify _site content
        run: |
          ls -R .
            
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3

  deploy_site: 
    name: Deploy Reports Site
    runs-on: ubuntu-latest
    needs: build_site
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{github.ref_name}}/${{ github.run_number }}
    steps:
      - name: Set sanitized branch name for artifact
        id: set_vars 
        run: echo "sanitized_branch=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

