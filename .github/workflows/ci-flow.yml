name: IOS-DEMO

on:
  push:
    branches:
      - test
      # - 'feature/**' # Запускать при push в feature-ветки
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  swiftlint_analysis:
    name: Static Analysis - SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify action content
        run: |
          cat ./.github/actions/create-swiftformat-report-page/action.yml

      - name: Create Swiftlint Report
        uses: ./.github/actions/create-swiftformat-report-page


  deploy_site: 
    name: Deploy Reports Site
    runs-on: ubuntu-latest
    needs: swiftlint_analysis
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set sanitized branch name
        id: set_vars
        run: echo "github_branch=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
