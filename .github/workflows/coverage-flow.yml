name: COVERAGE TEST

on: [push]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  coverage_report:
    name: Build and Upload Coverage Report
    runs-on: macos-latest 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify TestResults.xcresult content
        run: |
          echo "--- Listing contents of TestResults.xcresult ---"
          ls -R TestResults.xcresult
          echo "--- First 50 lines of TestResults.xcresult JSON summary ---"
          # Use xcresulttool to get a JSON summary and pipe to head to limit output
          xcrun xcresulttool get --path TestResults.xcresult --format json | head -n 50
          echo "--- End of TestResults.xcresult JSON summary ---"
        continue-on-error: true # Allow workflow to continue even if this step fails, for debugging

      - name: Generate coverage.json
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Generate HTML Report
        uses: ./.github/actions/coverage
        with:
          json-path: coverage.json
          source-dir: .
          output-path: ./_site/coverage-report.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  
  deploy_site: 
    name: Deploy Reports Site
    runs-on: ubuntu-latest
    needs: coverage_report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4