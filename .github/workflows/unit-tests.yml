name: Unit Tests

on:
  workflow_call:

jobs:
  run_unit_tests:
    name: Run
    runs-on: macos-latest
    steps:
      - name: Check npx allure awesome environment
        shell: bash
        run: |
          node -v
          npm -v
          npx -v

          echo "--- Verifying npx allure awesome command ---"
          if npx allure awesome -h; then
            echo "npx allure awesome command is accessible and executable."
          else
            echo "Error: npx allure awesome command failed to execute. This might indicate an issue with Node.js, npm, npx, or the allure-awesome package itself."
            exit 1
          fi
  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: xctestrun-build
          path: build

      - name: Run Unit Tests
        run: |
          # Find the .xctestrun file created in the previous step
          XCTESTRUN_FILE=$(find build -name "*.xctestrun")
          echo "Found xctestrun file at: $XCTESTRUN_FILE"
          
          DESTINATION_UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep '(Shutdown)' | head -n 1 | awk -F'[()]' '{print $2}')

          echo "Using destination UDID: $DESTINATION_UDID"

          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_FILE" \
            -destination "id=$DESTINATION_UDID" \
            -resultBundlePath unit-tests.xcresult
        continue-on-error: true
        
      - name: Generate Allure Report
        if: always()
        continue-on-error: true
        run: |
          npx allure awesome --output allure-report unit-tests.xcresult

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 1